[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymc-mlflow-example"
version = "0.1.0"
authors = [
    { name = "Will Dean", email = "wd60622@gmail.com" }
]
description = "Examples integrating PyMC with MLflow"
requires-python = ">= 3.13"
dependencies = []

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

[tool.pixi.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"

[tool.pixi.dependencies]
python = ">=3.13,<3.14"
arviz = ">=1.2,<2"
cxx-compiler = "*"
h5netcdf = ">=1.3"
jax = ">=0.7"
matplotlib = ">=3.9"
mlflow = ">=3.15.1,<4"
numpyro = ">=0.20"
nutpie = ">=0.16.10"
pandas = ">=2.1,<3"
pre-commit = ">=4.6.2,<5"
psutil = ">=5.9"
pymc = ">=6.0.1,<6.1"
pymc-marketing = ">=1.0.0,<2"
pyyaml = ">=6"
